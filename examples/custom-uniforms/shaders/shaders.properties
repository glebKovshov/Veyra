screen=<empty>
texture.noise=noise.png
blend.gbuffers_terrain.colortex1=off
# Original fixture definitions. The validation world starts at noon (worldTime 6000, sunAngle 0.25).
uniform.float.veyraNoonFade=clamp(1.0 - (abs(abs(sunAngle - 0.5) - 0.25) - 0.23) * 100.0, 0.0, 1.0)
uniform.float.shadowFade=clamp(1.0 - (abs(abs(sunAngle - 0.5) - 0.25) - 0.23) * 100.0, 0.0, 1.0)
uniform.float.veyraScaled=if(veyraDayTick == 7, veyraHalf * 4.0, \
    -1.0)
uniform.int.veyraDayTick=if(worldTime >= 0 && worldTime < 24000, 7, -3) + frameCounter % 1 * 5
uniform.int.framemod8=fmod(frameCounter, 8)
uniform.int.veyraExpectedFrameMod=fmod(frameCounter, 8)
uniform.int.veyraExpectedWorldTime=worldTime
uniform.bool.veyraFlag=veyraHalf < 1.0 && !is_sneaking
# Reads Iris' hardcoded velocity; the validation camera does not move.
uniform.float.veyraStill=if(velocity < 0.05, 1.0, 0.0)
# Intentionally declared after its consumers to exercise dependency ordering.
variable.float.veyraHalf=0.5
# Forward vector/component dependencies and mixed std140 widths in both graphics and post passes.
uniform.vec2.veyraPair=vec2(veyraTint.r, veyraTint.g)
uniform.vec3.veyraTint=clamp(veyraBase + vec3(0.25, 0.25, 0.25), vec3(0, 0, 0), vec3(1, 1, 1))
uniform.float.veyraTintTail=veyraTint.b
uniform.vec4.veyraQuad=if(veyraFlag, vec4(veyraPair.x, veyraPair.y, veyraTintTail, 1), vec4(0, 0, 0, 0))
variable.vec3.veyraBase=vec3(0, 0.25, 0.5)
