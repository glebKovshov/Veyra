plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly 'maven.modrinth:JYQhtZtO:hWKRTXbQ'
    modRuntimeOnly 'maven.modrinth:JYQhtZtO:hWKRTXbQ'
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly 'org.lwjgl:lwjgl-vulkan:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-vma:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-vulkan:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-vma:3.3.3'
    annotationProcessor 'net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7'
    implementation('org.anarres:jcpp:1.4.14') { transitive = false }
    include('org.anarres:jcpp:1.4.14') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testRuntimeOnly 'maven.modrinth:JYQhtZtO:hWKRTXbQ'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

loom {
    mixin {
        defaultRefmapName = 'veyra.refmap.json'
        useLegacyMixinAp = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('THIRD_PARTY_NOTICES.md')
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Extract this archive into shaderpacks/ to install the self-contained example folders.
tasks.register('packageExamplePacks', Zip) {
    archiveBaseName = 'veyra-example-packs'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('examples')
}

// CPU-only shader compiler checks, isolated from Minecraft's LWJGL dependency versions.
sourceSets {
    shaderSmoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def smokeOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def smokeArch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
def smokeNatives = 'natives-' + (smokeOs.contains('win') ? 'windows' : smokeOs.contains('mac') ? 'macos' : 'linux')
if (smokeArch in ['aarch64', 'arm64']) {
    smokeNatives += '-arm64'
}

dependencies {
    runtimeOnly "org.lwjgl:lwjgl-vma:3.3.3:${smokeNatives}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:${smokeNatives}"
    if (smokeOs.contains('mac')) runtimeOnly "org.lwjgl:lwjgl-vulkan:3.3.3:${smokeNatives}"
    shaderSmokeImplementation 'org.lwjgl:lwjgl-shaderc:3.3.3'
    shaderSmokeImplementation('org.anarres:jcpp:1.4.14') { transitive = false }
    shaderSmokeRuntimeOnly 'org.slf4j:slf4j-api:2.0.17'
    shaderSmokeRuntimeOnly "org.lwjgl:lwjgl:3.3.3:${smokeNatives}"
    shaderSmokeRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:${smokeNatives}"
}

tasks.register('validateShaders', JavaExec) {
    group = 'verification'
    description = 'Validate example shaders and include guards with shaderc on the CPU (no GPU required).'
    dependsOn tasks.named('shaderSmokeClasses')
    classpath = sourceSets.shaderSmoke.runtimeClasspath
    mainClass = 'dev.veyra.shader.ShaderCompileSmoke'
}

tasks.register('auditShaderPacks', JavaExec) {
    group = 'verification'
    description = 'Read-only source audit of external pack paths supplied with -PshaderPacks=path1,path2.'
    dependsOn tasks.named('shaderSmokeClasses')
    // Minecraft's Biomes class supplies the vanilla biome order that BiomesMixin records at runtime.
    classpath = sourceSets.shaderSmoke.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.veyra.shader.ShaderPackAudit'
    if (project.hasProperty('shaderPackAuditArguments')) {
        def auditArguments = new groovy.json.JsonSlurper().parse(file(project.property('shaderPackAuditArguments')))
        if (!(auditArguments instanceof List) || !auditArguments.every { it instanceof String }) {
            throw new GradleException('Shaderpack audit arguments must be a JSON array of strings.')
        }
        args auditArguments
    }
    if (project.hasProperty('shaderPacks')) args project.property('shaderPacks').toString().split(',')
}

// Development-only client integration harness; never included in the distributable mod.
sourceSets {
    graphicsSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        veyra { sourceSet sourceSets.main }
        veyra_graphics_smoke { sourceSet sourceSets.graphicsSmoke }
    }
    runs {
        graphicsSmoke {
            client()
            source = sourceSets.graphicsSmoke
            runDir = project.findProperty('graphicsSmokeRunDir')?.toString() ?: 'run-graphics-smoke'
            vmArgs '-Xmx3G', '-Dveyra.graphicsSmoke=true',
                    "-Dveyra.graphicsSmoke.output=${layout.buildDirectory.dir('reports/graphics-smoke').get().asFile.absolutePath}"
            programArgs '--quickPlaySingleplayer', 'VeyraValidation', '--width', '640', '--height', '360'
            if (project.hasProperty('graphicsSmokeComputeProbe')) {
                vmArgs '-Dveyra.graphicsSmoke.computeProbe=true'
            }
        }
    }
}
