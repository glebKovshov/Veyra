// Each audit case installs global adapter state (custom uniforms, ID maps), so cases run in separate
// JVMs rather than threads. Records are printed back in argument order, as a single JVM would.
abstract class ShaderPackAuditTask extends DefaultTask {
    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @Classpath
    abstract ConfigurableFileCollection getAuditClasspath()

    @Input
    abstract ListProperty<String> getAuditArguments()

    @Input
    abstract Property<Integer> getWorkers()

    @Input
    abstract Property<String> getWorkerHeap()

    @TaskAction
    void audit() {
        // --dimension/--profile apply to every following path; expand them into self-contained cases.
        List<List<String>> cases = []
        String dimension = '--dimension=0'
        String profile = '--profile='
        for (String argument : auditArguments.get()) {
            if (argument.startsWith('--dimension=')) dimension = argument
            else if (argument.startsWith('--profile=')) profile = argument
            else cases.add([dimension, profile, argument])
        }
        if (cases.isEmpty()) throw new GradleException('Supply pack paths with -PshaderPacks or -PshaderPackAuditArguments.')
        int count = Math.max(1, Math.min(cases.size(), workers.get()))
        // Strided assignment gives every worker a mix of heavy and light packs.
        List<List<Integer>> assignments = (0..<count).collect { int worker -> (worker..<cases.size()).step(count) }
        logger.lifecycle("Auditing ${cases.size()} shaderpack cases in ${count} parallel JVMs.")
        def pool = java.util.concurrent.Executors.newFixedThreadPool(count)
        List<Map> results
        try {
            def futures = assignments.collect { List<Integer> indices ->
                pool.submit({
                    def output = new ByteArrayOutputStream()
                    def errors = new ByteArrayOutputStream()
                    def result = execOperations.javaexec { spec ->
                        spec.classpath(auditClasspath)
                        spec.mainClass.set('dev.veyra.shader.ShaderPackAudit')
                        spec.maxHeapSize = workerHeap.get()
                        spec.jvmArgs('-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8')
                        spec.args(indices.collectMany { cases[it] })
                        spec.standardOutput = output
                        spec.errorOutput = errors
                        spec.ignoreExitValue = true
                    }
                    [indices: indices, exit: result.exitValue,
                     output: output.toString('UTF-8'), errors: errors.toString('UTF-8')]
                } as java.util.concurrent.Callable)
            }
            results = futures.collect { it.get() }
        } finally {
            pool.shutdownNow()
        }
        String[] records = new String[cases.size()]
        Set<String> diagnostics = new LinkedHashSet<>()
        List<String> failures = []
        results.each { Map result ->
            List<String> lines = result.output.readLines()
            List<String> json = lines.findAll { it.startsWith('{') && it.contains('"pack":') }
            diagnostics.addAll(lines.findAll { !it.isBlank() && !(it.startsWith('{') && it.contains('"pack":')) })
            if (!result.errors.isBlank()) System.err.print(result.errors)
            if (result.exit != 0 || json.size() != result.indices.size()) {
                failures.add("exit ${result.exit}, ${json.size()}/${result.indices.size()} records for "
                        + result.indices.collect { cases[it][2] + ' ' + cases[it][1] + ' ' + cases[it][0] }.join('; '))
            }
            json.eachWithIndex { String line, int index -> if (index < result.indices.size()) records[result.indices[index]] = line }
        }
        diagnostics.each { println it }
        records.each { if (it != null) println it }
        if (!failures.isEmpty()) throw new GradleException('Shaderpack audit workers failed:\n' + failures.join('\n'))
    }
}

tasks.register('auditShaderPacks', ShaderPackAuditTask) {
    group = 'verification'
    description = 'Read-only source audit of external pack paths supplied with -PshaderPacks=path1,path2. ' +
            'Cases run in parallel JVMs: -PshaderPackAuditWorkers (default: all logical CPUs), -PshaderPackAuditHeap (default 1536m).'
    dependsOn tasks.named('shaderSmokeClasses')
    // Minecraft's Biomes class supplies the vanilla biome order that BiomesMixin records at runtime.
    auditClasspath.from(sourceSets.shaderSmoke.runtimeClasspath, sourceSets.main.compileClasspath)
    if (project.hasProperty('shaderPackAuditArguments')) {
        def parsed = new groovy.json.JsonSlurper().parse(file(project.property('shaderPackAuditArguments')))
        if (!(parsed instanceof List) || !parsed.every { it instanceof String }) {
            throw new GradleException('Shaderpack audit arguments must be a JSON array of strings.')
        }
        auditArguments.addAll(parsed)
    }
    if (project.hasProperty('shaderPacks')) auditArguments.addAll(project.property('shaderPacks').toString().split(',') as List)
    workers = (project.findProperty('shaderPackAuditWorkers') ?: Runtime.runtime.availableProcessors()).toString().toInteger()
    workerHeap = (project.findProperty('shaderPackAuditHeap') ?: '1536m').toString()
}

// Development-only client integration harness; never included in the distributable mod.
sourceSets {
    graphicsSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        veyra { sourceSet sourceSets.main }
        veyra_graphics_smoke { sourceSet sourceSets.graphicsSmoke }
    }
    runs {
        graphicsSmoke {
            client()
            environmentVariable 'ALSOFT_DRIVERS', 'null'
            source = sourceSets.graphicsSmoke
            runDir = project.findProperty('graphicsSmokeRunDir')?.toString() ?: 'run-graphics-smoke'
            def graphicsSmokeOutput = project.findProperty('graphicsSmokeOutputDir')?.toString()
                    ?: layout.buildDirectory.dir('reports/graphics-smoke').get().asFile.absolutePath
            vmArgs '-Xmx3G', '-Dveyra.graphicsSmoke=true',
                    "-Dveyra.graphicsSmoke.output=${file(graphicsSmokeOutput).absolutePath}"
            if (project.hasProperty('graphicsSmokeDumpShaderSources')) {
                vmArgs '-Dveyra.debug.dumpShaderSources=true'
            }
            programArgs '--quickPlaySingleplayer', 'VeyraValidation', '--width', '640', '--height', '360'
            if (project.hasProperty('graphicsSmokeComputeProbe')) {
                vmArgs '-Dveyra.graphicsSmoke.computeProbe=true'
            }
            if (project.hasProperty('graphicsSmokeCaptureColorTargets')) {
                vmArgs '-Dveyra.graphicsSmoke.captureColorTargets=true'
            }
            if (project.hasProperty('graphicsSmokeThirdPartyLifecycle')) {
                vmArgs '-Dveyra.graphicsSmoke.thirdPartyLifecycle=true'
            }
            if (project.hasProperty('graphicsSmokeFailedReplacement')) {
                vmArgs '-Dveyra.graphicsSmoke.failedReplacement=true'
            }
            if (project.hasProperty('graphicsSmokeFixedClock')) {
                vmArgs '-Dveyra.reference.fixedClock=true'
            }
            if (project.hasProperty('graphicsSmokePackSwitch')) vmArgs '-Dveyra.graphicsSmoke.packSwitch=true'
            if (project.hasProperty('graphicsSmokeFreezeClock')) vmArgs "-Dveyra.graphicsSmoke.freezeClock=${project.property('graphicsSmokeFreezeClock')}"
            if (project.hasProperty('graphicsSmokeWaterPool')) vmArgs '-Dveyra.graphicsSmoke.waterPool=true'
            if (project.hasProperty('graphicsSmokePoolPlants')) vmArgs '-Dveyra.graphicsSmoke.poolPlants=true'
            if (project.hasProperty('graphicsSmokePoolSeagrass')) vmArgs '-Dveyra.graphicsSmoke.poolSeagrass=true'
            if (project.hasProperty('graphicsSmokeAllowOptionOverrides')) vmArgs '-Dveyra.graphicsSmoke.allowOptionOverrides=true'
            if (project.hasProperty('graphicsSmokePerfProbe')) vmArgs '-Dveyra.graphicsSmoke.perfProbe=true'
            if (project.hasProperty('graphicsSmokeAllowUniformFrame')) vmArgs '-Dveyra.graphicsSmoke.allowUniformFrame=true'
            if (project.hasProperty('graphicsSmokeFoliage')) vmArgs '-Dveyra.graphicsSmoke.foliage=true'
            if (project.hasProperty('graphicsSmokeGuiProbe')) vmArgs '-Dveyra.graphicsSmoke.guiProbe=true'
            if (project.hasProperty('graphicsSmokeReselectProbe')) vmArgs '-Dveyra.graphicsSmoke.reselectProbe=true'
            if (project.hasProperty('graphicsSmokeIconifyProbe')) vmArgs "-Dveyra.graphicsSmoke.iconifyProbe=${project.property('graphicsSmokeIconifyProbe')}"
            if (project.hasProperty('graphicsSmokeHoldTicks')) vmArgs "-Dveyra.graphicsSmoke.holdTicks=${project.property('graphicsSmokeHoldTicks')}"
            if (project.hasProperty('graphicsSmokeFrameSequence')) vmArgs "-Dveyra.graphicsSmoke.frameSequence=${project.property('graphicsSmokeFrameSequence')}"
        }
    }
}

if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.9', '1.21.10']) {
    def legacyTarget = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5']
    ['test', 'graphicsSmoke', 'shaderSmoke'].each { name ->
        def generated = layout.buildDirectory.dir("generated/sources/port${name}")
        def legacyPort = legacyTarget ? file("src/minecraft1215/${name}/java") : null
        def legacy4Port = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4'] ? file("src/minecraft1214/${name}/java") : null
        def legacy3Port = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3'] ? file("src/minecraft1213/${name}/java") : null
        def legacy1Port = project.minecraft_version == '1.21.1' ? file("src/minecraft1211/${name}/java") : null
        def newerPort = { entry -> (legacy4Port != null && new File(legacy4Port, entry.path).isFile())
                || (legacy3Port != null && new File(legacy3Port, entry.path).isFile())
                || (legacy1Port != null && new File(legacy1Port, entry.path).isFile()) }
        // 1.21.5-layer tests of VulkanMod 0.5.x types that VulkanMod 0.6.7 (1.21.1) shares with the newest targets.
        def legacySkipped = legacy1Port == null ? [] : ['dev/veyra/shader/VeyraStorageBufferUBOTest.java']
        def legacyPortHas = { entry -> legacyPort != null && new File(legacyPort, entry.path).isFile() && !(entry.path in legacySkipped) }
        def prepare = tasks.register("preparePort${name.capitalize()}Sources", Sync) {
            inputs.file('build.gradle')
            from("src/${name}/java") {
                // The older backend's converter/SSBO contracts run in checkLegacyTextureAdapters.
                if (legacyTarget && name == 'test') {
                    exclude 'dev/veyra/shader/NativeStorageParserTest.java'
                    // Texture-owned legacy sampler state is checked by the native adapter suite.
                    exclude 'dev/veyra/vulkan/VeyraBlockAtlasSamplerTest.java'
                }
                exclude { entry -> file("src/minecraft12110/${name}/java/${entry.path}").isFile()
                        || legacyPortHas(entry) || newerPort(entry) }
            }
            from("src/minecraft12110/${name}/java") {
                exclude { entry -> legacyPortHas(entry) || newerPort(entry) }
            }
            if (legacyPort != null) from(legacyPort) {
                exclude { entry -> newerPort(entry) || entry.path in legacySkipped }
                // 1.21.4 reports texture formats through dev.veyra.compat instead of this mixin.
                if (legacy4Port != null) exclude 'dev/veyra/mixin/LegacyTextureFormatTest.java'
            }
            if (legacy4Port != null) from(legacy4Port) {
                exclude { entry -> (legacy3Port != null && new File(legacy3Port, entry.path).isFile())
                        || (legacy1Port != null && new File(legacy1Port, entry.path).isFile()) }
            }
            if (legacy3Port != null) from(legacy3Port) {
                exclude { entry -> legacy1Port != null && new File(legacy1Port, entry.path).isFile() }
            }
            if (legacy1Port != null) from(legacy1Port)
            into(generated)
            filteringCharset = 'UTF-8'
            filter(veyraPortLine)
            if (legacyTarget) {
                filter { line -> line
                        .replace('com.mojang.blaze3d.buffers.Std140Builder', 'dev.veyra.shader.LegacyStd140Builder')
                        .replaceAll('\\bStd140Builder\\b', 'LegacyStd140Builder')
                        .replace('com.mojang.blaze3d.buffers.Std140SizeCalculator', 'dev.veyra.shader.LegacyStd140SizeCalculator')
                        .replaceAll('\\bStd140SizeCalculator\\b', 'LegacyStd140SizeCalculator')
                        .replace('net.minecraft.client.renderer.UniformValue', 'dev.veyra.shader.LegacyUniformValue')
                        .replaceAll('\\bUniformValue\\b', 'LegacyUniformValue') }
            }
            if (legacyTarget && name == 'graphicsSmoke') {
                filter { line -> line
                        .replace('import net.vulkanmod.vulkan.shader.DescriptorSets;', '')
                        .replace('@Mixin(value=DescriptorSets.class,remap=false)', '@Mixin(targets="net.vulkanmod.vulkan.shader.Pipeline$DescriptorSets",remap=false)')
                        .replace('.getWindow().handle()', '.getWindow().getWindow()')
                        .replace('button.onPress(null)', 'button.onPress()')
                        .replace('veyra$loseSurfaceOnce(VkSurfaceCapabilitiesKHR capabilities,', 'veyra$loseSurfaceOnce(')
                        .replaceAll('(Renderer\\.getInstance\\(\\)|renderer)\\.getMainPass\\(\\)', '((dev.veyra.vulkan.LegacyMainPassAccess) $1.getMainPass())')
                        .replaceAll('\\b(surface|swap|swapChain)\\.hasImages\\(\\)', '($1.getWidth() > 0 && $1.getHeight() > 0)')
                        .replace('new Buffer(', 'dev.veyra.vulkan.VeyraStorageDescriptor.createBuffer(')
                        .replace('nativePipeline.getBuffers()', 'dev.veyra.vulkan.VeyraUniformBlocks.buffers(nativePipeline)')
                        .replace('pipeline.getImageDescriptor(', 'dev.veyra.vulkan.LegacyImageDescriptors.find(pipeline.getImageDescriptors(), ')
                        .replace('client.level.dimensionType().cloudHeight().orElse(192)', 'client.level.effects().getCloudHeight()')
                        .replace('@Accessor("sets") long[] sets();', '@Accessor("sets") java.nio.LongBuffer sets();')
                        .replace('long[] sets=pool.sets();', 'long[] sets=dev.veyra.smoke.LegacyShutdownDescriptors.copy(pool.sets());') }
            }
            if (legacy4Port != null) filter(veyraLegacy4Line)
            if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3']) filter(veyraLegacy3Line)
            if (project.minecraft_version in ['1.21.2', '1.21.3']) filter(veyraVulkan053Line)
            if (project.minecraft_version == '1.21.1') filter(veyraLegacy1Line)
            if (project.minecraft_version == '1.21.1' && name == 'test') {
                // VulkanMod 0.6.7 has the shared presentation hooks and compiles with the 0.6.x GLSL parser;
                // Minecraft 1.21.1 clears with the macOS flag.
                filter { line -> line
                        .replace('"com/mojang/blaze3d/systems/RenderSystem", "clear", "(I)V", 2);', '"com/mojang/blaze3d/systems/RenderSystem", "clear", "(IZ)V", 2);')
                        .replace('"net/vulkanmod/vulkan/shader/converter/GlslConverter", "process", "(Ljava/lang/String;Ljava/lang/String;)V");',
                                '"net/vulkanmod/vulkan/shader/converter/GLSLParser", "parse", "(Lnet/vulkanmod/vulkan/shader/converter/Lexer;Lnet/vulkanmod/vulkan/shader/converter/GLSLParser$Stage;)V", 2);')
                        .replace('requiresCall("dev/veyra/compat/VkGpuDevice", "precompilePipeline",', 'requiresCalls("dev/veyra/compat/VkGpuDevice", "precompilePipeline",')
                        .replace('@Test void acquisitionResetOccursOnlyWhenAnImageIsAcquired()',
                                '@org.junit.jupiter.api.Disabled("VulkanMod 0.6.7 uses the shared submission hooks") @Test void acquisitionResetOccursOnlyWhenAnImageIsAcquired()')
                        .replace('@Test void presentationWaitUsesTheAcquiredImageAndExtraHandlesAreReleased()',
                                '@org.junit.jupiter.api.Disabled("VulkanMod 0.6.7 uses the shared submission hooks") @Test void presentationWaitUsesTheAcquiredImageAndExtraHandlesAreReleased()') }
            }
            if (project.minecraft_version in ['1.21.2', '1.21.3'] && name in ['test', 'shaderSmoke']) {
                // Terrain shader fixtures follow VulkanMod 0.5.3's compressed inputs.
                filter { line -> line
                        .replace('layout (location = 2) in uint PackedColor;', 'layout (location = 2) in uvec2 UV0;')
                        .replace('layout (location = 1) in uvec2 UV0;', 'layout (location = 1) in vec4 Color;')
                        .replace('layout(location = 1) in uvec2 UV0;', 'layout(location = 1) in vec4 Color;')
                        .replace('const vec4 Color = unpackUnorm4x8(PackedColor);', '')
                        // VulkanMod 0.5.3 images take no name.
                        .replace('"(Ljava/lang/String;JIIIIIIJ)V");', '"(JIIIIIIJ)V");') }
            }
            if (project.minecraft_version in ['1.21.2', '1.21.3'] && name == 'graphicsSmoke') {
                // VulkanMod 0.5.3 buffers allocate through Veyra's subclass, and its images take no name.
                filter { line -> line
                        .replaceAll('\\b(probe\\.readback|readback|glintMrtReadback|basicMrtReadback)\\.createBuffer\\(', '((dev.veyra.compat.LegacyBuffer) $1).allocate(')
                        .replaceAll('\\b(image|i)\\.name\\b(?!\\s*\\()', 'dev.veyra.compat.LegacyImageNames.of($1)') }
            }
            if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3'] && name == 'graphicsSmoke') {
                filter { line -> line
                        .replace('addParticle(net.minecraft.core.particles.ParticleTypes.CLOUD, true, true,', 'addParticle(net.minecraft.core.particles.ParticleTypes.CLOUD, true,') }
            }
            // NBT getters return values directly before 1.21.5.
            if (legacy4Port != null) filesMatching('dev/veyra/smoke/GraphicsFixtureWorldTest.java') {
                filter { line -> line.replace('.orElseThrow()', '') }
            }
        }
        sourceSets[name].java.setSrcDirs([generated])
        tasks.named(sourceSets[name].compileJavaTaskName) { dependsOn prepare }
    }
}

tasks.named('processGraphicsSmokeResources') {
    inputs.property 'minecraft_version', project.minecraft_release
    inputs.property 'vulkanmod_version', project.vulkanmod_version
    filesMatching('fabric.mod.json') {
        expand minecraft_version: project.minecraft_release, vulkanmod_version: project.vulkanmod_version
    }
}

if (project.minecraft_version == '1.21.5') {
    def compileLegacyUiChecks = tasks.register('compileLegacyUiChecks', JavaCompile) {
        source 'src/minecraft1215/java/dev/veyra/screen/ShaderPackListEntry.java'
        source 'src/minecraft1215/adapterChecks/java/dev/veyra/screen'
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = layout.buildDirectory.dir('legacy-ui-checks')
        options.compilerArgs += ['-proc:none']
    }
    tasks.register('checkLegacyUiAdapters', JavaExec) {
        dependsOn compileLegacyUiChecks
        classpath = files(compileLegacyUiChecks.flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath
        mainClass = 'dev.veyra.screen.ShaderPackListEntryCheck'
        enableAssertions = true
    }
}

if (project.minecraft_version == '1.21.5') {
    def compileLegacyTextureChecks = tasks.register('compileLegacyTextureChecks', JavaCompile) {
        dependsOn 'preparePortSources', 'compileJava'
        source fileTree(layout.buildDirectory.dir('generated/sources/minecraftPort')) {
            include 'dev/veyra/mixin/accessor/LegacyGpuTextureSamplerAccessor.java'
            include 'dev/veyra/mixin/accessor/NativePipelineAccessor.java'
            include 'dev/veyra/shader/ShaderPack*Uniform.java'
            include 'dev/veyra/shader/VeyraRenderTypes.java'
            include 'dev/veyra/shader/TextSubmissionContexts.java'
            include 'dev/veyra/shader/BlockIdMap.java'
            include 'dev/veyra/shader/ShaderSource.java'
            include 'dev/veyra/mixin/accessor/RenderTypeAccessor.java'
            include 'dev/veyra/vulkan/VeyraTextureSlots.java'
            include 'dev/veyra/VeyraLegacyBootstrap.java'
            include fileTree('src/minecraft1215/java').matching {
                include 'dev/veyra/vulkan/**', 'dev/veyra/shader/**'
                include 'dev/veyra/accessor/RenderTargetAccess.java'
                include 'dev/veyra/mixin/LegacyRenderTargetMixin.java'
                include 'dev/veyra/mixin/accessor/LegacyVulkanImageSamplerAccessor.java'
            }.files.collect { file('src/minecraft1215/java').toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        }
        source 'src/minecraft1215/adapterChecks/java/dev/veyra/vulkan'
        source 'src/graphicsSmoke/java/dev/veyra/smoke/LegacyShutdownDescriptors.java'
        source 'src/minecraft1215/adapterChecks/java/dev/veyra/shader'
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory = layout.buildDirectory.dir('legacy-texture-checks')
        options.compilerArgs += ['-proc:none']
    }
    tasks.register('checkLegacyTextureAdapters', JavaExec) {
        dependsOn compileLegacyTextureChecks
        classpath = files(compileLegacyTextureChecks.flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath + sourceSets.main.output
        classpath += configurations.shaderSmokeRuntimeClasspath.filter {
            it.name.startsWith('lwjgl-3.3.3-natives-') || it.name.startsWith('lwjgl-shaderc-3.3.3-natives-')
        }
        mainClass = 'dev.veyra.vulkan.LegacyTextureViewCheck'
        enableAssertions = true
    }
}

if (project.minecraft_version == '1.21.5') {
    tasks.named('check') { dependsOn 'checkLegacyUiAdapters', 'checkLegacyTextureAdapters' }
}
