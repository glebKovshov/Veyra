plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

// Explicit targets keep dependency versions together and outputs isolated.
if (project.hasProperty('targetMinecraft')) {
    def targetFile = file("gradle/targets/${project.property('targetMinecraft')}.properties")
    if (!targetFile.isFile()) throw new GradleException("Unknown Minecraft target: ${project.property('targetMinecraft')}")
    def target = new Properties()
    targetFile.withInputStream { target.load(it) }
    target.each { key, value -> project.ext.set(key.toString(), value.toString()) }
    // A target may run on a release other than the port line it builds with (1.21 uses the 1.21.1 port).
    if (!target.containsKey('minecraft_release')) project.ext.set('minecraft_release', project.minecraft_version)
    // One release version for every target; only the +mc suffix differs.
    project.ext.set('mod_version', project.mod_version.replaceFirst(/\+mc.*$/, '') + "+mc${project.minecraft_release}")
    layout.buildDirectory = file("build/targets/${project.property('targetMinecraft')}")
} else {
    project.ext.set('minecraft_release', project.minecraft_version)
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_release}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly "maven.modrinth:JYQhtZtO:${project.vulkanmod_id}"
    modRuntimeOnly "maven.modrinth:JYQhtZtO:${project.vulkanmod_id}"
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly 'org.lwjgl:lwjgl-vulkan:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-vma:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-vulkan:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-vma:3.3.3'
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.3.3'
    annotationProcessor 'net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7'
    implementation('org.anarres:jcpp:1.4.14') { transitive = false }
    include('org.anarres:jcpp:1.4.14') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    testImplementation 'org.lwjgl:lwjgl-shaderc:3.3.3'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testRuntimeOnly "maven.modrinth:JYQhtZtO:${project.vulkanmod_id}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'veyra.test.minecraft', project.minecraft_release
}

loom {
    mixin {
        defaultRefmapName = 'veyra.refmap.json'
        useLegacyMixinAp = true
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_release
    inputs.property 'vulkanmod_version', project.vulkanmod_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_release, vulkanmod_version: project.vulkanmod_version
        if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5']) filter { line -> line.replace(
                '"client": ["dev.veyra.VeyraClient"]',
                '"preLaunch": ["dev.veyra.VeyraLegacyBootstrap"],\n    "client": ["dev.veyra.VeyraClient"]') }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.9', '1.21.10']) {
    def minecraftParts = (project.minecraft_release.tokenize('.') + ['0']).collect { it.toInteger() }
    def shaderMinecraftVersion = minecraftParts[0] * 10000 + minecraftParts[1] * 100 + minecraftParts[2]
    ext.veyraPortLine = { line -> line.replaceAll('\\bIdentifier\\b', 'ResourceLocation')
                .replace('macros.put("MC_VERSION", "12111");', "macros.put(\"MC_VERSION\", \"${shaderMinecraftVersion}\");")
                .replace('net.minecraft.client.renderer.rendertype.RenderType', 'net.minecraft.client.renderer.RenderType')
                .replace('import com.mojang.blaze3d.shaders.ShaderSource;', 'import java.util.function.BiFunction;')
                .replace('ShaderSource source', 'BiFunction<ResourceLocation, ShaderType, String> source')
                .replace('ShaderSource shaderSource', 'BiFunction<ResourceLocation, ShaderType, String> shaderSource')
                .replace('source.get(pipeline.get', 'source.apply(pipeline.get')
                .replace('net.minecraft.util.Util', 'net.minecraft.Util')
                .replace('.identifier()', '.location()')
                .replace('import dev.veyra.mixin.accessor.TextureAtlasSpriteAccessor;', 'import dev.veyra.accessor.TextureAtlasSpriteAccessor;')
                .replace('case CUTOUT, TRIPWIRE ->', 'case CUTOUT, CUTOUT_MIPPED, TRIPWIRE ->')
                .replace('case CUTOUT ->', 'case CUTOUT, CUTOUT_MIPPED ->')
                // Older terrain shaders have no per-section uniform block.
                .replace('.addUB(PipelineConfigs.TERRAIN_UB2)', '')
                .replace('.addUniform("vec2", "TextureSize")', '')
                .replace('.addUniform("vec2", "TexelSize")', '')
                .replace('.addUniform("int", "UseRgss")', '')
                .replace('camera.yRot()', 'camera.getYRot()')
                .replace('camera.xRot()', 'camera.getXRot()')
                .replace('CustomVertexFormat.ELEMENT_POSITION_INT16', 'CustomVertexFormat.ELEMENT_POSITION')
                .replace('CustomVertexFormat.ELEMENT_UV0_UINT16', 'CustomVertexFormat.ELEMENT_UV0')
                .replace('CustomVertexFormat.ELEMENT_COLOR_UINT', 'CustomVertexFormat.ELEMENT_COLOR')
                .replace('net.vulkanmod.vulkan.VRenderSystem.setShaderTexture', 'com.mojang.blaze3d.systems.RenderSystem.setShaderTexture')
                .replace('net.vulkanmod.vulkan.VRenderSystem.getShaderTexture', 'com.mojang.blaze3d.systems.RenderSystem.getShaderTexture')
                .replace('VRenderSystem.setShaderTexture', 'com.mojang.blaze3d.systems.RenderSystem.setShaderTexture')
                .replace('VRenderSystem.getShaderTexture', 'com.mojang.blaze3d.systems.RenderSystem.getShaderTexture')
                .replace('com.mojang.blaze3d.textures.GpuSampler', 'dev.veyra.vulkan.LegacySampler')
                .replaceAll('\\bGpuSampler\\b', 'LegacySampler')
                .replace('device.createSampler(', 'dev.veyra.vulkan.LegacySampler.create(')
                .replace('RenderSystem.getSamplerCache()', 'dev.veyra.vulkan.LegacySampler')
                .replace('atlas.getSampler()', 'dev.veyra.vulkan.LegacySampler.from(atlas.getTexture())')
                .replaceAll('\\b(pass|renderPass)\\.bindTexture\\(', 'dev.veyra.vulkan.LegacySampler.bind($1, ') }
    // Minecraft 1.21.4 predates the GPU abstraction; dev.veyra.compat stands in for it.
    ext.veyraLegacy4Line = { line -> line
                    .replace('com.mojang.blaze3d.textures.', 'dev.veyra.compat.')
                    .replaceAll('com\\.mojang\\.blaze3d\\.pipeline\\.(RenderPipeline|CompiledRenderPipeline|BlendFunction)\\b', 'dev.veyra.compat.$1')
                    .replaceAll('com\\.mojang\\.blaze3d\\.systems\\.(RenderPass|GpuDevice|CommandEncoder)\\b', 'dev.veyra.compat.$1')
                    .replaceAll('com\\.mojang\\.blaze3d\\.shaders\\.(ShaderType|UniformType)\\b', 'dev.veyra.compat.$1')
                    .replaceAll('com\\.mojang\\.blaze3d\\.platform\\.(DepthTestFunction|PolygonMode|LogicOp|SourceFactor|DestFactor)\\b', 'dev.veyra.compat.$1')
                    .replace('net.minecraft.client.renderer.RenderPipelines', 'dev.veyra.compat.RenderPipelines')
                    .replace('net.vulkanmod.render.engine.', 'dev.veyra.compat.')
                    .replace('net.vulkanmod.interfaces.shader.ExtendedRenderPipeline', 'dev.veyra.compat.ExtendedRenderPipeline')
                    .replace('RenderSystem.getDevice()', 'dev.veyra.compat.VkGpuDevice.instance()')
                    .replace('shaderManager.getShader(', 'dev.veyra.compat.ShaderSources.get(shaderManager, ')
                    // Render targets and textures expose OpenGL-style ids; wrap them as texture handles.
                    .replaceAll('((?:\\w+\\.)*\\w+(?:\\(\\w*\\))?)\\.getColorTexture\\(\\)', 'dev.veyra.compat.VkGpuTexture.color($1)')
                    .replaceAll('((?:\\w+\\.)*\\w+(?:\\(\\w*\\))?)\\.getDepthTexture\\(\\)', 'dev.veyra.compat.VkGpuTexture.depth($1)')
                    .replace('veyra$atlasTexture = Minecraft.getInstance().getTextureManager().getTexture(', 'veyra$atlasTexture = dev.veyra.compat.VkGpuTexture.of(Minecraft.getInstance().getTextureManager().getTexture(')
                    .replace('TextureAtlas.LOCATION_BLOCKS).getTexture();', 'TextureAtlas.LOCATION_BLOCKS));')
                    .replaceAll('((?:\\w+\\.)*\\w+(?:\\(\\))?)\\.getTexture\\(\\)', 'dev.veyra.compat.VkGpuTexture.of($1)')
                    // NativeImage exposes no pixel address; the material uploads name their image "data".
                    .replace('data.getPointer()', '((dev.veyra.mixin.accessor.NativeImagePixelsAccessor) (Object) data).veyra$getPixels()')
                    .replaceAll('(\\w+)\\.getRenderPipeline\\(\\)', 'dev.veyra.compat.VanillaPipelines.of($1)')
                    .replaceAll('(\\w+)\\.getEffectBlendFactor\\(([\\w.]+), (\\w+)\\)', '$1.getEffect($2).getBlendFactor($1, $3)')
                    // Render targets have no label before 1.21.5.
                    .replaceAll('new TextureTarget\\("[^"]*"(?: \\+ \\w+)?(?: \\+ "[^"]*")?,\\s*', 'new TextureTarget(')
                    // 1.21.5 merged per-render-type shaders (entity, glint, ...); compare 1.21.4 shaders by their 1.21.5 id.
                    .replaceAll('([\\w.]+(?:\\(\\))?)\\.equals\\(ResourceLocation\\.withDefaultNamespace\\("(core/[\\w/]+)"\\)\\)', 'dev.veyra.compat.VanillaPipelines.shaderIs($1, "$2")')
                    .replace('boolean entityFragment = pipeline.getFragmentShader()', 'boolean entityFragment = dev.veyra.compat.VanillaPipelines.modern(pipeline.getFragmentShader())')
                    .replaceAll('^(\\s+&& )pipeline\\.getFragmentShader\\(\\)$', '$1dev.veyra.compat.VanillaPipelines.modern(pipeline.getFragmentShader())')
                    .replace('.getInventory().getSelectedSlot()', '.getInventory().selected')
                    .replace('.getInventory().getSelectedItem()', '.getInventory().getSelected()')
                    .replace('net.minecraft.client.Screenshot.takeScreenshot(', 'dev.veyra.smoke.LegacyScreenshot.take(') }
    // VulkanMod 0.5.3 (Minecraft 1.21.2/1.21.3) names its OpenGL emulation and buffer classes differently,
    // its images have no name, and Minecraft 1.21.3 predates several texture and color helpers.
    ext.veyraLegacy3Line = { line -> line
                    .replace('metadata.frames().orElse(List.of())', 'dev.veyra.compat.LegacyAnimation.frames(metadata)')
                    .replace('metadata.defaultFrameTime()', 'metadata.getDefaultFrameTime()')
                    .replace('metadata.interpolatedFrames()', 'metadata.isInterpolatedFrames()')
                    .replace('if (frame.index() < 0 || frame.index() >= frameCount)', 'if (frame.getIndex() < 0 || frame.getIndex() >= frameCount)')
                    .replace('frame index " + frame.index()', 'frame index " + frame.getIndex()')
                    .replace('new Frame(frame.index(), duration)', 'new Frame(frame.getIndex(), duration)')
                    .replace('frame.timeOr(', 'frame.getTime(')
                    .replace('AnimationMetadataSection.TYPE', 'AnimationMetadataSection.SERIALIZER')
                    .replace('protected int scrollBarX()', 'protected int getScrollbarPosition()')
                    // 1.21.3's world render entry point also takes the light texture.
                    .replace('GameRenderer gameRenderer, Matrix4f modelView,', 'GameRenderer gameRenderer, net.minecraft.client.renderer.LightTexture lightTexture, Matrix4f modelView,')
                    .replace('simple.resourceId()', '((dev.veyra.mixin.accessor.LegacySimpleTextureAccessor) simple).veyra$getLocation()')
                    .replaceAll('net\\.minecraft\\.util\\.ARGB\\.(red|green|blue)Float\\((\\w+)\\)', '(net.minecraft.util.ARGB.$1($2) / 255.0F)') }
    // VulkanMod 0.5.3 (Minecraft 1.21.2/1.21.3): older class names, unnamed images, protected buffer
    // members, color-before-UV0 terrain vertices and no swapchain resize callback.
    ext.veyraVulkan053Line = { line -> line
                    .replaceAll('\\bVkGl(Texture|Framebuffer|Renderbuffer|Buffer|Program)\\b', 'Gl$1')
                    .replace('net/vulkanmod/vulkan/memory/buffer/', 'net/vulkanmod/vulkan/memory/')
                    .replace('net.vulkanmod.vulkan.memory.buffer.', 'net.vulkanmod.vulkan.memory.')
                    .replaceAll('\\.setName\\((?:[^()"]|"[^"]*")*\\)', '')
                    .replace('(image.name, ', '(dev.veyra.compat.LegacyImageNames.of(image), ')
                    .replace('super(name, image, format,', 'super(image, format,')
                    .replace('new VulkanImage(sourceImage.name, imageId,', 'new VulkanImage(imageId,')
                    .replaceAll('\\b(renderer|Renderer\\.getInstance\\(\\))\\.getBoundFramebuffer\\(\\)', '((dev.veyra.mixin.accessor.RendererFramebufferAccessor) $1).veyra\\$getBoundFramebuffer()')
                    .replace('buffer.setId(0);', '((dev.veyra.mixin.accessor.LegacyBufferAccessor) buffer).veyra$setId(0);')
                    .replace('buffer.setAllocation(0);', '((dev.veyra.mixin.accessor.LegacyBufferAccessor) buffer).veyra$setAllocation(0);')
                    .replace('buffer.createBuffer(', '((dev.veyra.compat.LegacyBuffer) buffer).allocate(')
                    .replace('buffer.usage', 'dev.veyra.compat.LegacyBuffer.usage(buffer)')
                    .replace('private static final class NamedBuffer extends Buffer {', 'private static final class NamedBuffer extends dev.veyra.compat.LegacyBuffer {')
                    // Test fixtures set the protected metadata of Veyra's own buffers.
                    .replace('buffer.setBufferSize(', '((dev.veyra.compat.LegacyBuffer) buffer).assignBufferSize(')
                    .replace('buffer.setId(1234)', '((dev.veyra.compat.LegacyBuffer) buffer).assignId(1234)')
                    .replace('((dev.veyra.mixin.accessor.NativeImagePixelsAccessor) (Object) data).veyra$getPixels()', 'dev.veyra.compat.LegacyImageNames.pixels(data)')
                    // VulkanMod 0.5.3's compressed terrain vertex stores color before UV0 and reads it as a normalized vec4.
                    .replace('.add("UV0", CustomVertexFormat.ELEMENT_UV0)', '.add(VEYRA_SWAP_COLOR)')
                    .replace('.add("Color", CustomVertexFormat.ELEMENT_COLOR)', '.add("UV0", CustomVertexFormat.ELEMENT_UV0)')
                    .replace('.add(VEYRA_SWAP_COLOR)', '.add("Color", CustomVertexFormat.ELEMENT_COLOR)')
                    .replace('"layout (location = 2) in uint PackedColor;"', '"layout (location = 2) in uvec2 UV0;"')
                    .replace('#define gl_Color unpackUnorm4x8(PackedColor)', '#define gl_Color Color')
                    // VulkanMod 0.5.3 recreates swapchain textures without a resize callback, and its images take no name.
                    .replace('@Inject(method = {"onResize", "cleanUp"}, at = @At("HEAD"))', '@Inject(method = "cleanUp", at = @At("HEAD"))')
                    .replace('"Lnet/vulkanmod/vulkan/texture/VulkanImage;<init>(Ljava/lang/String;JIIIIIIJ)V"), index = 7)', '"Lnet/vulkanmod/vulkan/texture/VulkanImage;<init>(JIIIIIIJ)V"), index = 6)') }
    // VulkanMod 0.5.x (Minecraft 1.21.2-1.21.5) predates the 0.6 pipeline, sampler, view and pass APIs.
    ext.veyraVulkan05Line = { line -> line
                    .replace('worldRenderer.renderSectionLayer(layer,', 'worldRenderer.renderSectionLayer(net.vulkanmod.render.vertex.TerrainRenderType.getRenderType(layer),')
                    .replace('worldRenderer.renderSectionLayer(net.vulkanmod.render.vertex.TerrainRenderType.TRANSLUCENT,', 'worldRenderer.renderSectionLayer(net.minecraft.client.renderer.RenderType.translucent(),')
                    .replace('net.vulkanmod.vulkan.shader.PipelineConfig', 'dev.veyra.vulkan.LegacyPipelineConfig')
                    .replaceAll('\\bPipelineConfig\\b', 'LegacyPipelineConfig')
                    .replace('net.vulkanmod.render.shader.PipelineConfigs', 'dev.veyra.vulkan.LegacyPipelineConfigs')
                    .replaceAll('\\bPipelineConfigs\\b', 'LegacyPipelineConfigs')
                    .replace('net.vulkanmod.render.shader.ShaderLoadUtil', 'dev.veyra.vulkan.LegacyShaderLoadUtil')
                    .replaceAll('\\bShaderLoadUtil\\.', 'LegacyShaderLoadUtil.')
                    .replace('LegacyPipelineConfig config = LegacyPipelineConfig.fromJson("clouds",', 'LegacyPipelineConfig config = LegacyPipelineConfigs.clouds(')
                    .replace('LegacyShaderLoadUtil.loadShader(shaderPath, "clouds.vsh")', 'LegacyPipelineConfigs.cloudVertex(LegacyShaderLoadUtil.loadShader(shaderPath, "clouds.vsh"))')
                    .replace('Pipeline.Builder builder = new Pipeline.Builder(', 'dev.veyra.vulkan.LegacyPipelineBuilder builder = new dev.veyra.vulkan.LegacyPipelineBuilder(')
                    .replace('bindGraphicsImages(Pipeline.Builder builder,', 'bindGraphicsImages(dev.veyra.vulkan.LegacyPipelineBuilder builder,')
                    .replace('Pipeline.Builder builder, String vertexSource, String fragmentSource)', 'dev.veyra.vulkan.LegacyPipelineBuilder builder, String vertexSource, String fragmentSource)')
                    .replaceAll('\\b(\\w+)\\.getImageDescriptor\\(', 'dev.veyra.vulkan.LegacyImageDescriptors.find($1.getImageDescriptors(), ')
                    .replace('.isStorageImage()', '.isStorageImage')
                    .replace('net.vulkanmod.render.shader.PipelineManager', 'net.vulkanmod.render.PipelineManager')
                    .replace('PipelineManager.getTerrainVertexFormat()', 'PipelineManager.terrainVertexFormat')
                    .replaceAll('(Renderer\\.getInstance\\(\\)|renderer)\\.getMainPass\\(\\)', '((dev.veyra.vulkan.LegacyMainPassAccess) $1.getMainPass())')
                    .replace('image.uploadSubTextureAsync(level, 0, ', 'image.uploadSubTextureAsync(level, ')
                    .replace('.viewType(image.viewType)', '.viewType(VK_IMAGE_VIEW_TYPE_2D)')
                    .replace('.layerCount(image.arrayLayers)', '.layerCount(1)')
                    .replace('renderer.beginRenderPass(renderPass, framebuffer);', 'renderer.endRenderPass(); renderer.beginRendering(renderPass, framebuffer);')
                    .replace('renderer.beginRenderPass(translucentRenderPass, framebuffer);', 'renderer.endRenderPass(); renderer.beginRendering(translucentRenderPass, framebuffer);')
                    .replace('image.setSampler(SamplerManager.getSampler(true, false, mipLevels - 1));', 'texture.flushModeChanges(); image.setSampler(SamplerManager.getSampler(true, false, mipLevels - 1));')
                    .replace('net.vulkanmod.vulkan.texture.SamplerManager.getSampler(', 'dev.veyra.vulkan.LegacyNativeSamplers.getSampler(')
                    .replace('SamplerManager.getSampler(', 'dev.veyra.vulkan.LegacyNativeSamplers.getSampler(')
                    .replace('view.texture().getVulkanImage().setSampler(', 'dev.veyra.vulkan.LegacyNativeSamplers.setSampler(view.texture().getVulkanImage(), ')
                    .replaceAll('\\b(?!LegacyNativeSamplers\\b)(\\w+)\\.setSampler\\(', 'dev.veyra.vulkan.LegacyNativeSamplers.setSampler($1, ')
                    .replace('        setSampler(sampler);', '        dev.veyra.vulkan.LegacyNativeSamplers.setSampler(this, sampler);') }
    // Minecraft 1.21.1 and VulkanMod 0.6.7: shader instances instead of compiled programs.
    ext.veyraLegacy1Line = { line -> line
                    // The frame graph and its post passes arrived in 1.21.2; dev.veyra.compat stands in for them.
                    .replace('com.mojang.blaze3d.framegraph.', 'dev.veyra.compat.')
                    .replace('com.mojang.blaze3d.resource.', 'dev.veyra.compat.')
                    .replace('net.minecraft.client.renderer.PostPass', 'dev.veyra.compat.PostPass')
                    .replace('PostChain.MAIN_TARGET_ID', 'dev.veyra.compat.PostPass.MAIN_TARGET_ID')
                    // Compiled shader programs were shader instances before 1.21.2.
                    .replace('net.minecraft.client.renderer.CompiledShaderProgram', 'net.minecraft.client.renderer.ShaderInstance')
                    .replaceAll('\\bCompiledShaderProgram\\b', 'ShaderInstance')
                    .replace('net.minecraft.client.renderer.ShaderDefines', 'dev.veyra.compat.ShaderDefines')
                    .replace('net.minecraft.util.ARGB', 'dev.veyra.compat.ARGB')
                    .replace('.getDeltaTracker()', '.getTimer()')
                    // Render targets take the macOS clear flag; images store ABGR.
                    .replace('new TextureTarget(', 'dev.veyra.compat.LegacyTargets.textureTarget(')
                    .replaceAll('\\b(\\w+)\\.setPixel\\(', 'dev.veyra.compat.LegacyNativeImages.setPixel($1, ')
                    .replaceAll('\\b(\\w+)\\.getPixel\\(', 'dev.veyra.compat.LegacyNativeImages.getPixel($1, ')
                    .replaceAll('\\b(\\w+)\\.getPixels\\(\\)', 'dev.veyra.compat.LegacyNativeImages.getPixels($1)')
                    // VulkanMod 0.6.7 exposes the descriptor's texture slot through a getter.
                    .replaceAll('\\.imageIdx\\b(?!\\s*[(=])', '.getImageIdx()')
                    // VulkanMod 0.6.7 begins passes with beginRenderPass and returns the main depth image itself.
                    .replace('renderer.beginRendering(', 'renderer.beginRenderPass(')
                    .replace('import dev.veyra.vulkan.LegacyMainPassAccess;', '')
                    .replace('((LegacyMainPassAccess) Renderer.getInstance().getMainPass()).getDepthAttachment()', 'dev.veyra.compat.LegacyMainDepth.texture()')
                    .replaceAll('\\(\\(dev\\.veyra\\.vulkan\\.LegacyMainPassAccess\\) ([^()]+(?:\\(\\))?)\\.getMainPass\\(\\)\\)', '$1.getMainPass()')
                    // The shader manager, program keys and configs arrived in 1.21.2; dev.veyra.compat reads
                    // the core shader resources instead, and shader states hold suppliers of shader instances.
                    .replace('net.minecraft.client.renderer.ShaderManager', 'dev.veyra.compat.ShaderManager')
                    .replace('net.minecraft.client.renderer.ShaderProgram', 'dev.veyra.compat.ShaderProgram')
                    .replace('import dev.veyra.mixin.accessor.MinecraftAccessor;', '')
                    .replace('((MinecraftAccessor) Minecraft.getInstance()).veyra$getShaderManager()', 'dev.veyra.compat.ShaderManager.INSTANCE')
                    .replace('.veyra$getShader().orElse(null)', '.veyra$getShader().map(ShaderProgram::of).orElse(null)')
                    .replace('RenderSystem.setShader(active.getProgram().program());', 'RenderSystem.setShader(active.getProgram()::program);')
                    .replace('net.vulkanmod.interfaces.shader.ShaderMixed', 'net.vulkanmod.interfaces.ShaderMixed')
                    // VulkanMod 0.6.7 image views take a layer count; samplers come from explicit options.
                    .replace('VK10.VK_IMAGE_ASPECT_DEPTH_BIT, sourceImage.mipLevels);', 'VK10.VK_IMAGE_ASPECT_DEPTH_BIT, 1, sourceImage.mipLevels);')
                    .replaceAll('[\\w]+(?:\\.getInstance\\(\\))?\\.getMainPass\\(\\)\\.getDepthAttachment\\(\\)', 'dev.veyra.compat.LegacyMainDepth.texture()')
                    .replace('int flags = magFilter == FilterMode.LINEAR ? SamplerManager.LINEAR_FILTERING_BIT : 0;', 'boolean mipmapped = useMipmaps && getMipLevels() > 1;')
                    .replace('if (addressModeU == AddressMode.CLAMP_TO_EDGE) flags |= SamplerManager.CLAMP_BIT;', '')
                    .replace('if (useMipmaps && getMipLevels() > 1) {', '{')
                    .replace('flags |= SamplerManager.USE_MIPMAPS_BIT;', '')
                    .replace('if (minFilter == FilterMode.LINEAR) flags |= SamplerManager.MIPMAP_LINEAR_FILTERING_BIT;', '')
                    .replace('getVulkanImage().updateTextureSampler(getMipLevels() - 1, (byte) flags);', 'getVulkanImage().setSampler(SamplerManager.getSampler(addressModeU == AddressMode.CLAMP_TO_EDGE, magFilter == FilterMode.LINEAR, mipmapped && minFilter == FilterMode.LINEAR, mipmapped ? getMipLevels() - 1 : 0));')
                    .replace('.isStorageImage) {', '.isStorageImage()) {')
                    // Minecraft 1.21.1 API shapes.
                    .replace('RenderSystem;clear(I)V', 'RenderSystem;clear(IZ)V')
                    .replace('PipelineConfig config = PipelineConfig.fromJson("clouds",', 'PipelineConfig config = dev.veyra.vulkan.VeyraCloudConfigs.clouds(')
                    .replace('ShaderLoadUtil.loadShader(shaderPath, "clouds.vsh")', 'dev.veyra.vulkan.VeyraCloudConfigs.cloudVertex(ShaderLoadUtil.loadShader(shaderPath, "clouds.vsh"))')
                    .replace('Binding(int width, int height, CallbackInfo callback)', 'Binding(int width, int height, boolean macos, CallbackInfo callback)')
                    .replace('veyra$preserveWorldDepthForHand(int mask)', 'veyra$preserveWorldDepthForHand(int mask, boolean macos)')
                    .replace('RenderSystem.clear(mask);', 'RenderSystem.clear(mask, macos);')
                    .replace('return minecraft.level.getSkyColor(minecraft.gameRenderer.getMainCamera().getPosition(), partialTick);', 'return dev.veyra.compat.ARGB.fromRgb(minecraft.level.getSkyColor(minecraft.gameRenderer.getMainCamera().getPosition(), partialTick));')
                    .replaceAll('\\.getPrecipitationAt\\(([^,()]+), [\\w.]*getSeaLevel\\(\\)\\)', '.getPrecipitationAt($1)')
                    .replace('stack.get(net.minecraft.core.component.DataComponents.ITEM_MODEL)', '(net.minecraft.resources.ResourceLocation) null')
                    .replace('minecraft.level.getMinY()', 'minecraft.level.getMinBuildHeight()')
                    .replace('swapTargetA.resize(width, height);', 'swapTargetA.resize(width, height, Minecraft.ON_OSX);')
                    .replace('swapTargetB.resize(width, height);', 'swapTargetB.resize(width, height, Minecraft.ON_OSX);')
                    .replace('target.resize(settings.width(), settings.height());', 'target.resize(settings.width(), settings.height(), Minecraft.ON_OSX);')
                    .replace('Mth.lerp(partialTick, entity.zOld, entity.getZ()) - camera.z, partialTick,', 'Mth.lerp(partialTick, entity.zOld, entity.getZ()) - camera.z, Mth.lerp(partialTick, entity.yRotO, entity.getYRot()), partialTick,')
                    .replace('.create(server.overworld(), net.minecraft.world.entity.EntitySpawnReason.COMMAND)', '.create(server.overworld())') }
    def legacyOverrides = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5'] ? file('src/minecraft1215/java') : null
    // 1.21.4 has no GPU abstraction: src/minecraft1214 supplies dev.veyra.compat stand-ins and its own hooks.
    def legacy4Overrides = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4'] ? file('src/minecraft1214/java') : null
    // 1.21.3 layers src/minecraft1213 over the 1.21.4 backend for the APIs 1.21.4 added.
    def legacy3Overrides = project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3'] ? file('src/minecraft1213/java') : null
    // 1.21.1 layers src/minecraft1211 over that for what 1.21.2 added: compiled shader programs and the frame graph.
    def legacy1Overrides = project.minecraft_version == '1.21.1' ? file('src/minecraft1211/java') : null
    def excludeLines = (legacy4Overrides == null ? [] : file('gradle/targets/1.21.4.excludes').readLines())
            .plus(legacy3Overrides == null ? [] : file('gradle/targets/1.21.3.excludes').readLines())
            .plus(legacy1Overrides == null ? [] : file('gradle/targets/1.21.1.excludes').readLines())
            .findAll { it && !it.startsWith('#') }
    // "<layer>:<path>" drops only that layer's copy, so the next lower layer supplies the file.
    def legacy4Excludes = excludeLines.findAll { !it.contains(':') }
    def skippedInLayer = { String layer -> excludeLines.findAll { it.startsWith(layer + ':') }.collect { it.substring(layer.length() + 1) } }
    def layerHas = { File dir, String layer, entry -> dir != null && new File(dir, entry.path).isFile() && !(entry.path in skippedInLayer(layer)) }
    def newerLayer = { entry -> layerHas(legacy4Overrides, 'minecraft1214', entry)
            || layerHas(legacy3Overrides, 'minecraft1213', entry) || layerHas(legacy1Overrides, 'minecraft1211', entry) }
    def portSources = layout.buildDirectory.dir('generated/sources/minecraftPort')
    def preparePortSources = tasks.register('preparePortSources', Sync) {
        inputs.file('build.gradle')
        from('src/main/java') {
            exclude 'dev/veyra/mixin/accessor/RenderSetupAccessor.java'
            exclude 'dev/veyra/mixin/accessor/TextureAtlasSpriteAccessor.java'
            exclude 'dev/veyra/mixin/DynamicGraphicsPipelineMixin.java'
            if (legacyOverrides != null) exclude 'dev/veyra/mixin/accessor/RenderTargetAccessor.java'
            if (legacyOverrides != null) {
                exclude 'dev/veyra/accessor/ItemLayerRenderStateAccess.java'
                exclude 'dev/veyra/mixin/accessor/ItemLayerRenderStateInvoker.java'
                exclude 'dev/veyra/mixin/SubmitNodeCollectionMixin.java'
                exclude 'dev/veyra/mixin/GuiRendererMixin.java'
                exclude 'dev/veyra/mixin/TextFeatureRendererMixin.java'
                exclude 'dev/veyra/mixin/accessor/LevelRendererAccessor.java'
                exclude 'dev/veyra/mixin/accessor/VkGpuTextureAccessor.java'
                exclude 'dev/veyra/mixin/accessor/ShaderManagerAccessor.java'
                if (legacy1Overrides == null) exclude 'dev/veyra/mixin/accessor/LexerAccessor.java'
                if (legacy1Overrides == null) exclude 'dev/veyra/mixin/UniformBlockMixin.java'
                exclude 'dev/veyra/mixin/accessor/PostPassAccessor.java'
                if (legacy1Overrides == null) exclude 'dev/veyra/mixin/VulkanFramebufferMipMixin.java'
                if (legacy1Overrides == null) exclude 'dev/veyra/mixin/ThreadBuilderPackMixin.java'
            }
            exclude { entry -> file("src/minecraft12110/java/${entry.path}").isFile()
                    || layerHas(legacyOverrides, 'minecraft1215', entry) || newerLayer(entry) }
            exclude legacy4Excludes
        }
        from('src/minecraft12110/java') {
            exclude { entry -> layerHas(legacyOverrides, 'minecraft1215', entry) || newerLayer(entry) }
            exclude legacy4Excludes
        }
        if (legacyOverrides != null) from(legacyOverrides) {
            exclude { entry -> newerLayer(entry) || entry.path in skippedInLayer('minecraft1215') }
            exclude legacy4Excludes
        }
        if (legacy4Overrides != null) from(legacy4Overrides) {
            exclude { entry -> layerHas(legacy3Overrides, 'minecraft1213', entry) || layerHas(legacy1Overrides, 'minecraft1211', entry)
                    || entry.path in skippedInLayer('minecraft1214') }
            exclude legacy4Excludes
        }
        if (legacy3Overrides != null) from(legacy3Overrides) {
            exclude { entry -> layerHas(legacy1Overrides, 'minecraft1211', entry) || entry.path in skippedInLayer('minecraft1213') }
            exclude legacy4Excludes
        }
        if (legacy1Overrides != null) from(legacy1Overrides)
        into(portSources)
        filteringCharset = 'UTF-8'
        // Mojang renamed these types in 1.21.11; keep one shared implementation.
        filter(veyraPortLine)
        // Match the legacy CPU terrain block; leave modern shader fixtures in test sources intact.
        filter { line -> line.replaceAll('^\\s*(?:ivec2 TextureSize;|vec2 TexelSize;|int UseRgss;)\\s*$', '') }
        if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5']) {
            filter { line -> line
                    .replace('net.minecraft.client.renderer.UniformValue', 'dev.veyra.shader.LegacyUniformValue')
                    .replaceAll('\\bUniformValue\\b', 'LegacyUniformValue')
                    .replace('com.mojang.blaze3d.buffers.Std140Builder', 'dev.veyra.shader.LegacyStd140Builder')
                    .replaceAll('\\bStd140Builder\\b', 'LegacyStd140Builder')
                    .replace('com.mojang.blaze3d.buffers.Std140SizeCalculator', 'dev.veyra.shader.LegacyStd140SizeCalculator')
                    .replaceAll('\\bStd140SizeCalculator\\b', 'LegacyStd140SizeCalculator')
                    .replace('dev.veyra.mixin.accessor.RenderTargetAccessor', 'dev.veyra.accessor.RenderTargetAccess')
                    .replaceAll('\\bRenderTargetAccessor\\b', 'RenderTargetAccess')
                    .replaceAll('\\b(\\w+)\\.getColorTextureView\\(\\)', 'dev.veyra.accessor.RenderTargetAccess.colorView($1)')
                    .replaceAll('\\b(\\w+)\\.getDepthTextureView\\(\\)', 'dev.veyra.accessor.RenderTargetAccess.depthView($1)')
                    .replace('originalType.pipeline()', 'originalType.getRenderPipeline()')
                    .replace('camera.position()', 'camera.getPosition()')
                    .replace('"core/screenquad"', '"post/screenquad"')
                    .replace('.getWindow().handle()', '.getWindow().getWindow()')
                    // The old upload API has no array-layer argument; material atlases are 2D.
                    // RGB views are registered only for 2D color attachments and their snapshots.
                    .replaceAll('\\b(player|vehicle)\\.isInShallowWater\\(\\)', '($1.isInWater() && !$1.isUnderWater())')
                    .replace('com.mojang.blaze3d.systems.RenderSystem.setShaderTexture', 'dev.veyra.vulkan.LegacyTextureSlots.setShaderTexture')
                    .replace('com.mojang.blaze3d.systems.RenderSystem.getShaderTexture', 'dev.veyra.vulkan.LegacyTextureSlots.getShaderTexture')
                    // Native wrapping starts with dirty defaults; apply them before the material's explicit sampler.
                    .replace('com.mojang.blaze3d.textures.GpuTextureView', 'dev.veyra.vulkan.LegacyTextureView')
                    .replace('net.vulkanmod.render.engine.VkTextureView', 'dev.veyra.vulkan.LegacyVkTextureView')
                    .replaceAll('\\bGpuTextureView\\b', 'LegacyTextureView')
                    .replaceAll('\\bVkTextureView\\b', 'LegacyVkTextureView')
                    .replace('device.createTextureView(', 'dev.veyra.vulkan.LegacyVkTextureView.create(')
                    .replace('pass.bindSampler(name, view);', 'pass.bindSampler(name, view == null ? null : view.textureForBinding());') }
        }
        if (project.minecraft_version in ['1.21.2', '1.21.3', '1.21.4', '1.21.5']) filter(veyraVulkan05Line)
        if (legacy4Overrides != null) {
            inputs.file('gradle/targets/1.21.4.excludes')
            if (legacy3Overrides != null) inputs.file('gradle/targets/1.21.3.excludes')
            if (legacy1Overrides != null) inputs.file('gradle/targets/1.21.1.excludes')
            filter(veyraLegacy4Line)
        }
        if (project.minecraft_version in ['1.21.1', '1.21.2', '1.21.3']) filter(veyraLegacy3Line)
        if (project.minecraft_version in ['1.21.2', '1.21.3']) filter(veyraVulkan053Line)
        if (legacy1Overrides != null) filter(veyraLegacy1Line)
    }
    sourceSets.main.java.setSrcDirs([portSources])
    if (legacyOverrides != null) {
        tasks.register('checkPortAdapters') {
            // VulkanMod 0.6.7 (1.21.1) compiles through its own 0.6.x pipeline builder, covered by the shared tests.
            if (legacy1Overrides == null) {
                dependsOn project.minecraft_version in ['1.21.2', '1.21.3', '1.21.4'] ? 'checkLegacy4PipelineAdapters' : 'checkLegacyTextureAdapters'
            }
        }
        tasks.named('check') { dependsOn 'checkPortAdapters' }
    } else {
        def compilePortAdapterChecks = tasks.register('compilePortAdapterChecks', JavaCompile) {
            dependsOn preparePortSources, tasks.named('compileJava')
            source fileTree(portSources) {
                include 'dev/veyra/vulkan/LegacySampler.java'
                include 'dev/veyra/vulkan/LegacyAcquisition.java'
                include 'dev/veyra/mixin/accessor/LegacyGpuTextureSamplerAccessor.java'
            }
            source 'src/minecraft12110/adapterChecks/java'
            classpath = sourceSets.main.compileClasspath + sourceSets.main.output
            destinationDirectory = layout.buildDirectory.dir('port-adapter-checks')
            options.compilerArgs += ['-proc:none']
        }
        def checkPortAdapters = tasks.register('checkPortAdapters', JavaExec) {
            dependsOn compilePortAdapterChecks
            classpath = files(compilePortAdapterChecks.flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath + sourceSets.main.output
            mainClass = 'dev.veyra.vulkan.LegacySamplerCheck'
            enableAssertions = true
        }
        tasks.named('check') { dependsOn checkPortAdapters }
    }
    tasks.named('compileJava') { dependsOn preparePortSources }
    tasks.named('sourcesJar') { dependsOn preparePortSources }
    tasks.named('processResources') {
        inputs.file('build.gradle')
        filesMatching('veyra.mixins.json') {
            if (legacyOverrides != null) filter { line -> line.replace('"accessor.RenderTargetAccessor",', '"LegacyRenderTargetMixin",\n    "accessor.LegacyVulkanImageSamplerAccessor",')
                    .replace('"accessor.ItemLayerRenderStateInvoker",', '')
                    .replace('"SubmitNodeCollectionMixin",', '')
                    .replace('"GuiRendererMixin",', '')
                    .replace('"TextFeatureRendererMixin",', '')
                    .replace('"accessor.LevelRendererAccessor",', '')
                    .replace('"accessor.VkGpuTextureAccessor",', '"LegacyTextureFormatMixin",')
                    .replace('"accessor.ShaderManagerAccessor",', '')
                    .replace('"accessor.LexerAccessor",', legacy1Overrides == null ? '' : '"accessor.LexerAccessor",')
                    .replace('"UniformBlockMixin",', legacy1Overrides == null ? '' : '"UniformBlockMixin",')
                    .replace('"accessor.PostPassAccessor",', '"accessor.LegacyMainPassAccessor",')
                    .replace('"VulkanFramebufferMipMixin",', (legacy1Overrides == null ? '' : '"VulkanFramebufferMipMixin",\n    ')
                            + '"LegacyVertexAttributesMixin",\n    "LegacyVertexFormatOffsetsMixin",')
                    .replace('"ThreadBuilderPackMixin",', legacy1Overrides == null ? '"LegacyTerrainBuilderMixin",' : '"ThreadBuilderPackMixin",')
                    .replace('"GLSLParserMixin",', '"GLSLParserMixin",\n    "LegacyPipelineBindingsMixin",\n    "LegacyUniformParserMixin",\n    "LegacyDescriptorSetsMixin",') }
            filter { line -> line.replace('"accessor.SpriteAnimationStateAccessor",',
                    '"accessor.SpriteAnimationStateAccessor",\n    "accessor.LegacySpriteTickerAccessor",\n    "accessor.LegacyGpuTextureSamplerAccessor",\n    "accessor.LegacyGlFramebufferAccessor",\n    "LegacyImageUploadMixin",\n    "LegacyRenderPassDependencyMixin",')
                    .replace('"accessor.TextureAtlasSpriteAccessor",', '"LegacyTextureAtlasSpriteMixin",')
                    .replace('"accessor.RenderSetupAccessor",', '')
                    .replace('"DynamicGraphicsPipelineMixin",', '') }
            if (legacy4Overrides != null) {
                def excludedMixins = legacy4Excludes.findAll { it.startsWith('dev/veyra/mixin/') }
                        .collect { it.substring('dev/veyra/mixin/'.length()).replace('.java', '').replace('/', '.') }
                filter { line ->
                    // Earlier rewrites may have expanded one entry into several lines.
                    if (line.contains('\n') && !line.contains('"client": [')) {
                        return line.split('\n').findAll { !(it.trim().replaceAll('^"|",?$', '') in excludedMixins) }.join('\n')
                    }
                    def entry = line.trim().replaceAll('^"|",?$', '')
                    if (entry in excludedMixins) return ''
                    def added = (legacy3Overrides == null ? [] : ['LegacyItemRendererMixin',
                            'accessor.LegacyBufferAccessor', 'accessor.LegacySimpleTextureAccessor']) +
                            (legacy1Overrides == null ? [] : ['LegacyFogUniformsMixin'])
                    line.replace('"client": [', '"client": [\n' + (added + [
                            'LegacyDefaultFramebufferClearMixin', 'LegacyDepthViewMixin', 'LegacyImageLifecycleMixin', 'LegacyVulkanCleanupMixin', 'Legacy4UniformParserMixin', 'LegacyMainTargetBindMixin', 'LegacyProgramBindMixin', 'LegacyRenderTypeDrawMixin', 'LegacyShaderConfigsMixin',
                            'LegacyVertexBufferDrawMixin', 'accessor.BooleanStateShardAccessor',
                            'accessor.CompiledShaderProgramInvoker', 'accessor.CompositeStateAccessor',
                            'accessor.DepthTestStateShardAccessor', 'LegacyTextureDeletionMixin',
                            'accessor.NativeImagePixelsAccessor', 'accessor.RenderStateShardAccessor',
                            'accessor.RenderTypeCreateInvoker', 'accessor.ShaderSourceKeyAccessor',
                            'accessor.ShaderStateShardAccessor', 'accessor.WriteMaskStateShardAccessor'])
                            .findAll { !(it in excludedMixins) }
                            .collect { "    \"${it}\"," }.join('\n'))
                }
            }
        }
    }
}

