name: Graphics smoke

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/graphicsSmoke/**'
      - 'scripts/prepare_graphics_smoke.py'
      - 'examples/geometry-mid-texcoord/**'
      - 'examples/terrain-block-id/**'
      - 'examples/terrain-vertex-execution/**'
      - 'examples/terrain-vertex-varyings/**'
      - 'examples/custom-image-compute/**'
      - 'examples/cloud-custom-image/**'
      - 'examples/water-block-id/**'
      - 'examples/entity-mrt/**'
      - 'examples/entity-colortex-feedback/**'
      - 'examples/entity-vertex-execution/**'
      - 'examples/block-vertex-execution/**'
      - 'examples/damagedblock-vertex-execution/**'
      - 'examples/hand-vertex-execution/**'
      - 'examples/current-rendered-item-id/**'
      - 'examples/glint-vertex-execution/**'
      - 'examples/glint-mrt-outputs/**'
      - 'examples/basic-vertex-execution/**'
      - 'examples/gbuffers-skybasic-vertex-execution/**'
      - 'examples/skytextured-stage-variants/**'
      - 'examples/beaconbeam-vertex-execution/**'
      - 'examples/weather-vertex-execution/**'
      - 'examples/particles-translucent-vertex-execution/**'
      - 'examples/textured-default-vertex-attributes/**'
      - 'examples/cloud-texture-inputs/**'
      - 'examples/cloud-model-view/**'
      - 'build.gradle'
      - '.github/workflows/graphics-smoke.yml'
  push:
    branches: ['feature/iris-compatibility-0.2']
    paths:
      - '.github/workflows/graphics-smoke.yml'
      - 'src/graphicsSmoke/**'
      - 'scripts/prepare_graphics_smoke.py'
      - 'src/main/**'
      - 'examples/geometry-mrt/**'
      - 'examples/entity-mrt/**'
      - 'examples/entity-colortex-feedback/**'
      - 'examples/water-opaque-depth/**'
      - 'examples/water-color-inputs/**'
      - 'examples/geometry-view-space/**'
      - 'examples/terrain-block-id/**'
      - 'examples/terrain-vertex-execution/**'
      - 'examples/terrain-vertex-varyings/**'
      - 'examples/custom-image-compute/**'
      - 'examples/cloud-custom-image/**'
      - 'examples/water-block-id/**'
      - 'examples/current-rendered-item-id/**'
      - 'examples/glint-vertex-execution/**'
      - 'examples/glint-mrt-outputs/**'
      - 'examples/basic-vertex-execution/**'
      - 'examples/gbuffers-skybasic-vertex-execution/**'
      - 'examples/skytextured-stage-variants/**'
      - 'examples/beaconbeam-vertex-execution/**'
      - 'examples/weather-vertex-execution/**'
      - 'examples/particles-translucent-vertex-execution/**'
      - 'examples/textured-default-vertex-attributes/**'
      - 'examples/cloud-texture-inputs/**'
      - 'examples/cloud-model-view/**'
      - 'scripts/prepare_graphics_smoke.py'
      - 'examples/specular-*/**'
      - 'examples/shadow-color-*/**'
      - 'examples/water-shadow-depth-*/**'
      - 'examples/water-post-shadow-inputs/**'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  lavapipe-client:
    strategy:
      fail-fast: false
      matrix:
        fixture: [geometry-mrt, entity-mrt, entity-colortex-feedback, entity-vertex-execution, block-vertex-execution, damagedblock-vertex-execution, hand-vertex-execution, geometry-view-space, geometry-mid-texcoord, terrain-block-id, terrain-vertex-execution, terrain-vertex-varyings, custom-image-compute, cloud-custom-image, water-block-id, water-opaque-depth, water-color-inputs, specular-atlas, specular-entity, shadow-color-terrain, shadow-color-entity, water-shadow-depth-terrain, water-shadow-depth-entity, water-post-shadow-inputs, custom-uniforms, cloud-colortex0, cloud-texture-inputs, cloud-model-view, current-rendered-item-id, glint-vertex-execution, glint-mrt-outputs, basic-vertex-execution, skybasic-vertex-execution, skytextured-stage-variants, beaconbeam-vertex-execution, weather-vertex-execution, particles-translucent-vertex-execution, textured-default-vertex-attributes, vanilla-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install software Vulkan and validation layers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xvfb libglfw3 libflite1
      - name: Prepare original validation world
        run: python3 scripts/prepare_graphics_smoke.py --fixture '${{ matrix.fixture }}'
      - name: Launch Minecraft with software Vulkan
        shell: bash
        env:
          LP_NUM_THREADS: '2'
          XDG_SESSION_TYPE: x11
          ALSOFT_DRIVERS: 'null'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          vulkaninfo --summary > vulkan-device.txt 2>&1
          extra_args=()
          if [[ '${{ matrix.fixture }}' == 'terrain-vertex-varyings' ]]; then
            extra_args+=('-PgraphicsSmokeComputeProbe=true')
          fi
          timeout 11m xvfb-run -a ./gradlew --no-daemon runGraphicsSmoke "${extra_args[@]}" 2>&1 | tee graphics-client.log
      - name: Verify real frame readback and validation output
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          result=json.loads(pathlib.Path('build/reports/graphics-smoke/result.json').read_text())
          print(json.dumps(result,indent=2))
          text=pathlib.Path('graphics-client.log').read_text(errors='replace')
          errors=re.findall(r'.*(?:VUID-|Validation Error|VK_ERROR_DEVICE_LOST).*',text)
          # Minecraft/VulkanMod 0.6.8 reports its still-live process-wide Vulkan objects only
          # after disconnecting the test player and entering vkDestroyDevice. Keep those
          # teardown diagnostics in the artifact, but gate runtime rendering separately.
          marker='Stopping singleplayer server as player logged out'
          shutdown=text.find(marker)
          assert shutdown >= 0, 'The smoke client did not shut down its validation world cleanly'
          runtime_errors=re.findall(r'.*(?:VUID-|Validation Error|VK_ERROR_DEVICE_LOST).*',text[:shutdown])
          teardown_errors=re.findall(r'.*(?:VUID-|Validation Error|VK_ERROR_DEVICE_LOST).*',text[shutdown:])
          pathlib.Path('build/reports/graphics-smoke/validation-errors.txt').write_text('\n'.join(errors))
          pathlib.Path('build/reports/graphics-smoke/runtime-validation-errors.txt').write_text('\n'.join(runtime_errors))
          pathlib.Path('build/reports/graphics-smoke/teardown-validation-errors.txt').write_text('\n'.join(teardown_errors))
          print(f'Runtime validation errors: {len(runtime_errors)}')
          print(f'Process teardown validation diagnostics: {len(teardown_errors)} (preserved in artifact)')
          assert not runtime_errors, 'Vulkan validation errors occurred before Minecraft shutdown; inspect the uploaded log'
          assert result['status']=='passed', result
          if '${{ matrix.fixture }}' == 'terrain-vertex-varyings':
              probe=json.loads(pathlib.Path('build/reports/graphics-smoke/compute-image-probe.json').read_text())
              assert probe == {'status':'passed','format':'r16ui','texels':64,'expected':42}, probe
              print('Custom-image compute readback:', probe)
          for phase in ['before-backend-cleanup','before-allocator-destruction']:
              snapshot=json.loads(pathlib.Path(f'build/reports/graphics-smoke/shutdown-{phase}.json').read_text())
              assert snapshot['phase']==phase
              print(f"Shutdown {phase}: buffers={len(snapshot['buffers'])}, images={len(snapshot['images'])}, pipelines={len(snapshot['pipelines'])}")
          PY
      - name: Upload graphics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphics-smoke-evidence-${{ matrix.fixture }}
          path: |
            build/reports/graphics-smoke/
            run-graphics-smoke/logs/
            run-graphics-smoke/crash-reports/
            graphics-client.log
            vulkan-device.txt
          if-no-files-found: warn
          retention-days: 14
