name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches mod version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and test
        run: ./gradlew --no-daemon build validateShaders packageExamplePacks
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release-assets
          cp build/libs/veyra-*.jar release-assets/
          cp build/distributions/veyra-example-packs-*.zip release-assets/
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "Veyra ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
