name: Release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  source-audit:
    uses: ./.github/workflows/shaderpack-audit.yml
  graphics-smoke:
    uses: ./.github/workflows/graphics-smoke.yml
  release:
    needs: [source-audit, graphics-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check release ref matches mod version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF_NAME" = "release/$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Test shutdown audit tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build and test
        run: ./gradlew --no-daemon build validateShaders packageExamplePacks
      - name: Verify distributable contents
        run: python3 scripts/verify_jar.py
      # Each older Minecraft version gets its own JAR with exact dependency pins.
      - name: Build and verify older Minecraft targets
        shell: bash
        run: |
          for target in 1.21.10 1.21.9 1.21.5 1.21.4; do
            ./gradlew --no-daemon --project-cache-dir ".gradle/targets/$target" build validateShaders "-PtargetMinecraft=$target"
            python3 scripts/verify_jar.py --target "$target"
          done
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release-assets
          cp build/libs/veyra-*.jar release-assets/
          for target in 1.21.10 1.21.9 1.21.5 1.21.4; do
            find "build/targets/$target/libs" -name "veyra-*+mc$target.jar" -exec cp {} release-assets/ \;
          done
          cp build/distributions/veyra-example-packs-*.zip release-assets/
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > existing-tag.txt; then
            tag_commit=$(awk -v tag_ref="refs/tags/$RELEASE_TAG" '
              $2 == tag_ref { direct = $1 }
              $2 == tag_ref "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }
            ' existing-tag.txt)
            test "$tag_commit" = "$GITHUB_SHA"
          fi
          release_flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" --title "Veyra ${RELEASE_TAG#v}" \
            --notes-file RELEASE_NOTES.md "${release_flags[@]}"
      - name: Verify downloaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded-release
          (cd downloaded-release && sha256sum --check SHA256SUMS.txt)
          python3 scripts/verify_jar.py "downloaded-release/veyra-${RELEASE_TAG#v}.jar"
          base="${RELEASE_TAG#v}"
          for target in 1.21.10 1.21.9 1.21.5 1.21.4; do
            python3 scripts/verify_jar.py --target "$target" "downloaded-release/veyra-${base%%+mc*}+mc$target.jar"
          done
