name: Release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  source-audit:
    uses: ./.github/workflows/shaderpack-audit.yml
  graphics-smoke:
    uses: ./.github/workflows/graphics-smoke.yml
  release:
    needs: [source-audit, graphics-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check release ref matches mod version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF_NAME" = "release/$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew --no-daemon build validateShaders packageExamplePacks
      - name: Verify distributable contents
        run: python3 scripts/verify_jar.py
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release-assets
          cp build/libs/veyra-*.jar release-assets/
          cp build/distributions/veyra-example-packs-*.zip release-assets/
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > existing-tag.txt; then
            tag_commit=$(awk -v tag_ref="refs/tags/$RELEASE_TAG" '
              $2 == tag_ref { direct = $1 }
              $2 == tag_ref "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }
            ' existing-tag.txt)
            test "$tag_commit" = "$GITHUB_SHA"
          fi
          release_flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          # The release branch run creates a v* tag, which starts a second run.
          # Reuse that release on the tag run instead of creating it twice.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            expected_assets=$(cd release-assets && printf '%s\n' *)
            missing_asset=false
            while IFS= read -r asset; do
              if ! grep -Fxq "$asset" <<<"$existing_assets"; then
                missing_asset=true
              fi
            done <<<"$expected_assets"
            if [[ "$missing_asset" == true ]]; then
              gh release upload "$RELEASE_TAG" release-assets/* --clobber
            else
              echo "Release already contains all assets; skipping duplicate publish."
            fi
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" --title "Veyra ${RELEASE_TAG#v}" \
              --notes-file RELEASE_NOTES.md "${release_flags[@]}"
          fi
