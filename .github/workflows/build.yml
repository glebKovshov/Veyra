name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build mod
        run: ./gradlew --no-daemon build validateShaders

      - name: Verify distributable contents
        run: python3 scripts/verify_jar.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: veyra-minecraft-1.21.11
          path: build/libs/veyra-*+mc1.21.11.jar
          if-no-files-found: error
          retention-days: 14
