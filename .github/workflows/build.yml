name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: veyra-minecraft-1.21.11
          path: build/libs/veyra-*-mc1.21.11.jar
          if-no-files-found: error
          retention-days: 14
